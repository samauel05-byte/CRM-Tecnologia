name: CRM Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-windows-main
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Verify local recovery and backups
        run: npm run test:local
      - name: Build
        shell: pwsh
        run: |
          $config=Get-Content deployment/windows/configuracion-publica.json -Raw | ConvertFrom-Json
          $env:NEXT_PUBLIC_SUPABASE_URL=$config.supabaseUrl
          $env:NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$config.supabasePublishableKey
          npm run build
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Package and check
        shell: pwsh
        run: |
          ./deployment/windows/Empaquetar-CRM.ps1 -Destino "$env:RUNNER_TEMP/crm-package"
          $env:NODE_ENV='production'
          $env:HOSTNAME='127.0.0.1'
          $env:PORT='3099'
          $config=Get-Content deployment/windows/configuracion-publica.json -Raw | ConvertFrom-Json
          $env:NEXT_PUBLIC_SUPABASE_URL=$config.supabaseUrl
          $env:NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$config.supabasePublishableKey
          $server=Start-Process -FilePath "$env:RUNNER_TEMP/crm-package/runtime/node.exe" -ArgumentList "$env:RUNNER_TEMP/crm-package/app/server.js" -WindowStyle Hidden -PassThru
          try {
            $healthy=$false
            for($i=0;$i -lt 30;$i++){try{if((Invoke-WebRequest http://127.0.0.1:3099/login -TimeoutSec 2).StatusCode -eq 200){$healthy=$true;break}}catch{};Start-Sleep 1}
            if(-not $healthy){throw 'El paquete no arranca.'}
            if((Invoke-WebRequest http://127.0.0.1:3099/icons.js).StatusCode -ne 200){throw 'Faltan recursos.'}
            if((Invoke-WebRequest http://127.0.0.1:3099/operations.js).StatusCode -ne 200){throw 'Faltan las herramientas de seguimiento.'}
            $localStatus=Invoke-RestMethod http://127.0.0.1:3099/api/local/status
            if($localStatus.local -ne $false){throw 'Paquete con estado local inesperado.'}
            if(-not (Invoke-RestMethod http://127.0.0.1:3099/api/version).version){throw 'Falta la version de la interfaz.'}
          } finally {Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}
          Compress-Archive -Path "$env:RUNNER_TEMP/crm-package/*" -DestinationPath "$env:RUNNER_TEMP/CRM-Tecnologia-Windows.zip"
      - name: Publish verified Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='windows-'+$env:GITHUB_SHA
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag "$env:RUNNER_TEMP/CRM-Tecnologia-Windows.zip" --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag "$env:RUNNER_TEMP/CRM-Tecnologia-Windows.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "CRM Windows $env:GITHUB_SHA" --notes 'Paquete Windows compilado y verificado automaticamente para la red local.'
          }
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
